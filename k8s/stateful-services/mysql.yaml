# 2️⃣ 配置 ConfigMap，存储 MySQL Master & Slave 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: url-shortener
data:
  master.cnf: |
    [mysqld]
    server-id=1
    log-bin=mysql-bin
    binlog-format=row
    max_binlog_size=100M
    expire_logs_days=10
    sync-binlog=1
    skip-name-resolve
  slave.cnf: |
    [mysqld]
    server-id=${POD_ORDINAL}
    relay-log=mysql-relay-bin
    log-slave-updates=1
    read-only=1
    skip-name-resolve
---
