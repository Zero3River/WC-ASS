# 1. ConfigMap - Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: url-shortener
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    dir /data

---
# 2. Secret - Store Redis Password Securely
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
data:
  REDIS_PASSWORD: cmVkaXM= # Base64 for "redis"

---
# 3. Persistent Volume for Redis Master
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-master-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: "/mnt/data/redis-master"

---
# 4. Persistent Volume Claim for Redis Master
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-master-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: redis-master-pv
  storageClassName: standard

---

---
# 5. Redis Master StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
    spec:
      containers:
        - name: redis
          image: redis/redis-stack:latest
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            [
              "/bin/sh",
              "-c",
              "redis-server /etc/redis/redis.conf --requirepass $REDIS_PASSWORD",
            ]
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-master-pvc

---
# 6. Redis Master Service
apiVersion: v1
kind: Service
metadata:
  name: redis-master
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
    role: master

---
# 7. Persistent Volume for Redis Replicas
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-replica-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: "/mnt/data/redis-replica"

---
# 8. Persistent Volume Claim for Redis Replicas
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-replica-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: redis-replica-pv
  storageClassName: standard

---
# 9. Redis Replica StatefulSet (FIXED PASSWORD HANDLING)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
spec:
  serviceName: redis-replica
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      containers:
        - name: redis
          image: redis/redis-stack:latest
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            [
              "/bin/sh",
              "-c",
              "redis-server /etc/redis/redis.conf --requirepass $REDIS_PASSWORD --masterauth $REDIS_PASSWORD --replicaof redis-master 6379",
            ]
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-replica-pvc

---
# 10. Redis Replica Service
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
    role: replica
